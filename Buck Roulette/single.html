<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buck Roulette</title>

    <link rel="stylesheet" href="single.css">
</head>
<body>
    <h1 id="Title">Buck Roulette</h1>

    <div id="Health-box" class="Health-box f">
        <div class="Health-box-2">
            <img id="Heart1" class="Health" src="Picturs/Heart.webp" width="50px">
            <img id="Heart2" class="Health" src="Picturs/Heart.webp" width="50px">
            <img id="Heart3" class="Health" src="Picturs/Heart.webp" width="50px">
            <img id="Heart4" class="Health" src="Picturs/Heart.webp" width="50px">
        </div>
    </div>

    <div id="NPC-Health-box" class="NPC-Health-box f">
        <div class="NPC-Health-box-2">
            <img id="NPC-Heart1" class="NPC-Health" src="Picturs/Heart.webp" width="50px">
            <img id="NPC-Heart2" class="NPC-Health" src="Picturs/Heart.webp" width="50px">
            <img id="NPC-Heart3" class="NPC-Health" src="Picturs/Heart.webp" width="50px">
            <img id="NPC-Heart4" class="NPC-Health" src="Picturs/Heart.webp" width="50px">
        </div>
    </div>

    <div id="Wrapper-Move-Monition" class="Wrapper-Move-Monition f">
        <div class="Monition-box">
            <div class="Monition-box-2">
                <img id="Monition1" class="Monition" width="200px">
                <img id="Monition2" class="Monition" width="200px">
                <img id="Monition3" class="Monition" width="200px">
                <img id="Monition4" class="Monition" width="200px">
                <img id="Monition5" class="Monition" width="200px">
                <img id="Monition6" class="Platzpatrone" width="200px">
                <img id="Monition7" class="Platzpatrone" width="200px">
                <img id="Monition8" class="Platzpatrone" width="200px">
                <img id="Monition9" class="Platzpatrone" width="200px">
                <img id="Monition10" width="200px" class="Platzpatrone">
            </div>
        </div>
    </div>

    <div id="Item-box" class="Item-box f">
        <h1>Your item Box</h1>
        <div class="Item-box-2">
            <div class="Item-row">
                <img src="Picturs/lupe.png" width="50px">
                <h1 id="Lupe">0x</h1>
            </div>

            <hr>

            <div class="Item-row">
                <img src="Picturs/Zigaretten.webp" width="50px">
                <h1 id="Zigaretten">0x</h1>
            </div>

            <hr>

            <div class="Item-row">
                <img src="Picturs/Bier.png" width="50px">
                <h1 id="Bier">0x</h1>
            </div>

            <hr>

            <div class="Item-row">
                <img src="Picturs/Handschellen.png" width="50px">
                <h1 id="Handschellen">0x</h1>
            </div>

            <hr>

            <div class="Item-row">
                <img src="Picturs/Säge.png" width="50px">
                <h1 id="Säge">0x</h1>
            </div>
        </div>
    </div>

    <div id="NPC-Item-box" class="NPC-Item-box f">
        <h1>NPCs item Box</h1>
        <div class="NPC-Item-box-2">
            <div class="NPC-Item-row">
                <img src="Picturs/lupe.png" width="50px">
                <h1 id="NPC-Lupe">0x</h1>
            </div>

            <hr>

            <div class="NPC-Item-row">
                <img src="Picturs/Zigaretten.webp" width="50px">
                <h1 id="NPC-Zigaretten">0x</h1>
            </div>

            <hr>

            <div class="NPC-Item-row">
                <img src="Picturs/Bier.png" width="50px">
                <h1 id="NPC-Bier">0x</h1>
            </div>

            <hr>

            <div class="NPC-Item-row">
                <img src="Picturs/Handschellen.png" width="50px">
                <h1 id="NPC-Handschellen">0x</h1>
            </div>

            <hr>

            <div class="NPC-Item-row">
                <img src="Picturs/Säge.png" width="50px">
                <h1 id="NPC-Säge">0x</h1>
            </div>
        </div>
    </div>

    <div id="Back">
        <a href="../Buck Roulette/index.html">
            <button id="Back-button">Back</button>
        </a>
    </div>

    <script src="single.js"></script>

</html>
