<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goon Away</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <aside class="left">
        <diV class="Upgrades-background">
            <div class="Upgrades">
                <div class="Upgrade">
                    <div>
                        <h2>Max Crits</h2>
                        <p>Level: 0</p>
                        <p>Price: 0 €</p>
                    </div>
                    <button id="Max_Crits" class="Upgrade-Button">Upgrade</button>
                </div>
                <div class="Upgrade">
                    <div>
                        <h2>Crit Multiplyer</h2>
                        <p>Level: 0</p>
                        <p>Price: 0 €</p>
                    </div>
                    <button id="Crit_Multiplyer" class="Upgrade-Button">Upgrade</button>
                </div>
                <div class="Upgrade">
                    <div>
                        <h2>Strength</h2>
                        <p>Level: 0</p>
                        <p>Price: 0 €</p>
                    </div>
                    <button id="Strength" class="Upgrade-Button">Upgrade</button>
                </div>
                <div class="Upgrade">
                    <div>
                        <h2>Speed</h2>
                        <p>Level: 0</p>
                        <p>Price: 0 €</p>
                    </div>
                    <button id="Speed" class="Upgrade-Button">Upgrade</button>
                </div>
            </div>
        </diV>
    </aside>
    <aside class="right">
        <div class="Progress-Bar-Background">
            <div id="Progress-Bar"></div>
        </div>

        <button id="Pump-Button">Pump Once</button>
    </aside>
</body>
</html>
